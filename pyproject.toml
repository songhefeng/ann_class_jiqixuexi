[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "breast-cancer-ann-classify"
version = "1.0.0"
authors = [
  { name = "宋禾丰", email = "example@mail.com" }
]
description = "基于人工神经网络(ANN)的威斯康星乳腺癌二分类项目"
long_description = """
本项目使用PyTorch搭建全连接人工神经网络，完成乳腺癌数据集良恶性分类。
包含数据预处理、模型训练、多维度性能评估、可视化、SHAP模型可解释性分析全流程，
适用于机器学习课程大作业与神经网络入门实践。
"""
long_description_content_type = "text/markdown"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
  "pandas",
  "numpy",
  "matplotlib",
  "seaborn",
  "torch",
  "scikit-learn",
  "shap"
]

[project.urls]
"Homepage" = "https://github.com/yourname/breast-cancer-ann"
"Bug Tracker" = "https://github.com/yourname/breast-cancer-ann/issues"
